name: Build API image

# Build + publication GHCR uniquement. Le déploiement sur les EC2 se fait
# séparément, par Ansible (repo sunu-boutik-infra, ansible/DEPLOYMENT.md),
# avec le tag sha-<commit> produit ici. Aucune connexion aux serveurs.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-api-${{ github.ref }}
  # Chaque commit de main doit avoir son image (cible potentielle de rollback).
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag immuable uniquement : sha-<SHA complet>. Pas de `latest`.
          tags: |
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image API publiée"
            echo
            echo "\`${{ steps.meta.outputs.tags }}\`"
            echo
            echo "Déploiement (manuel, repo infra) : \`api_image_tag: sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
