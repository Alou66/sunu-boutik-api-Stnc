name: Test and Build API image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sunu_boutik_test
          POSTGRES_USER: testuser
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d sunu_boutik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 httpx==0.27.2

      - name: Run complete test suite
        env:
          DATABASE_URL: postgresql://testuser@127.0.0.1:5544/sunu_boutik_test
          SECRET_KEY: test-secret-key-not-for-production
          SMTP_USER: ""
          SMTP_PASSWORD: ""
        run: python -m pytest -q

  build-and-push:
    name: Build and publish API image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image API publiée"
            echo
            echo "\`${{ steps.meta.outputs.tags }}\`"
            echo
            echo "Déploiement manuel via Ansible/SSM."
            echo "Tag : \`api_image_tag: sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
